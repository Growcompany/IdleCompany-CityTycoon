<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Cropout에서 배운 것과 회사키우기에서 직접 구축한 것</title>
  <desc id="desc">왼쪽의 아이소메트릭 마을 일러스트는 Cropout에서 배운 설계 기준을, 오른쪽은 회사키우기(CompanyGrowthRenewal)에서 독립적으로 구축한 C++ 시스템(수명주기 서비스 경계, 타입 데이터·CommonUI 라우팅, 크로스플랫폼 카메라 도메인, 결정적 게임플레이 파이프라인)을 나타냅니다.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1018"/>
      <stop offset="0.52" stop-color="#101D2C"/>
      <stop offset="1" stop-color="#0A121D"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#55D7FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#55D7FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sceneSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E718E"/>
      <stop offset="0.55" stop-color="#33586E"/>
      <stop offset="1" stop-color="#183342"/>
    </linearGradient>
    <linearGradient id="sceneShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08111B" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#0B1721" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0B1721" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="rightCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122538"/>
      <stop offset="1" stop-color="#0D1826"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173348"/>
      <stop offset="1" stop-color="#112438"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#75E7C5"/>
      <stop offset="1" stop-color="#55D7FF"/>
    </linearGradient>
    <clipPath id="leftClip"><rect x="64" y="232" width="620" height="540" rx="30"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="720" cy="410" r="350" fill="url(#cyanGlow)"/>
  <path d="M0 760 C350 690 520 850 850 770 C1120 705 1320 760 1600 690 L1600 900 L0 900 Z" fill="#0C1724"/>
  <g opacity="0.18" stroke="#8BDCF3" stroke-width="1">
    <path d="M1050 20 L1600 292"/><path d="M1135 0 L1600 230"/><path d="M960 0 L1600 317"/>
    <path d="M0 695 L410 900"/><path d="M0 620 L560 900"/>
  </g>

  <!-- Header -->
  <rect x="64" y="54" width="244" height="38" rx="19" fill="#15354A" stroke="#3AA6C9"/>
  <circle cx="88" cy="73" r="6" fill="#55D7FF"/>
  <text x="106" y="79" fill="#BDEFFF" font-family="'Segoe UI', 'Noto Sans KR', Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.7">아키텍처 학습 기준</text>
  <text x="64" y="154" fill="#F8FAFC" font-family="'Segoe UI', 'Noto Sans KR', Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-0.5">Cropout에서 배운 것 — 그 위에 직접 구축한 것</text>
  <text x="64" y="197" fill="#9DB1C3" font-family="'Segoe UI', 'Noto Sans KR', Arial, sans-serif" font-size="23">왼쪽은 학습 기준, 오른쪽은 회사키우기가 직접 소유한 C++ 시스템과 책임 경계입니다.</text>

  <!-- Left visual card shadow and base -->
  <rect x="72" y="242" width="620" height="540" rx="30" fill="#02070D" opacity="0.5"/>
  <rect x="64" y="232" width="620" height="540" rx="30" fill="url(#sceneSky)" stroke="#577E91" stroke-width="2"/>

  <g clip-path="url(#leftClip)">
    <!-- distant landscape -->
    <circle cx="592" cy="300" r="86" fill="#E6C878" opacity="0.36"/>
    <path d="M44 488 L214 370 L342 420 L493 326 L720 468 L720 620 L42 620 Z" fill="#264B4C"/>
    <path d="M20 526 L193 411 L334 461 L492 374 L719 509 L719 650 L20 650 Z" fill="#32704E"/>

    <!-- isometric terrain islands -->
    <polygon points="86,574 350,418 654,586 386,748" fill="#4D8B50"/>
    <polygon points="86,574 386,748 386,774 86,600" fill="#2F613C"/>
    <polygon points="386,748 654,586 654,612 386,774" fill="#254F38"/>
    <polygon points="143,571 351,449 590,581 383,706" fill="#6A9D56"/>

    <!-- river / road -->
    <path d="M122 620 C218 578 267 606 343 561 C420 516 463 514 587 568 L550 601 C459 568 418 570 355 609 C272 660 213 621 145 657 Z" fill="#85C5CA" opacity="0.72"/>
    <path d="M170 530 C246 506 298 489 355 454 C424 412 493 450 571 486" fill="none" stroke="#D9BE83" stroke-width="32" stroke-linecap="round" opacity="0.9"/>
    <path d="M170 530 C246 506 298 489 355 454 C424 412 493 450 571 486" fill="none" stroke="#F0D89C" stroke-width="18" stroke-linecap="round" opacity="0.9"/>

    <!-- farm plots -->
    <g transform="translate(480 567)">
      <polygon points="0,26 62,-10 119,22 57,59" fill="#8A633E"/>
      <path d="M16 25 L67 -4 M35 37 L86 8 M54 48 L105 19" stroke="#D7A65E" stroke-width="5"/>
    </g>

    <!-- focal blue roof building -->
    <g>
      <polygon points="281,500 381,441 474,494 373,554" fill="#B8785B"/>
      <polygon points="281,500 373,554 373,640 281,586" fill="#D59B75"/>
      <polygon points="373,554 474,494 474,580 373,640" fill="#AE765E"/>
      <polygon points="258,487 379,415 497,483 373,557" fill="#628BB0"/>
      <polygon points="258,487 373,557 373,578 258,507" fill="#456C91"/>
      <polygon points="373,557 497,483 497,504 373,578" fill="#345A7D"/>
      <rect x="315" y="548" width="35" height="58" rx="3" fill="#76513E" transform="skewY(30)"/>
      <polygon points="405,555 448,530 448,563 405,588" fill="#BDE8E9"/>
      <path d="M426 543 L426 575 M405 571 L448 546" stroke="#4B7380" stroke-width="4"/>
      <rect x="363" y="404" width="18" height="38" rx="5" fill="#D6E2E6"/>
    </g>

    <!-- coral roof cottage -->
    <g transform="translate(-34 -10)">
      <polygon points="190,505 247,473 304,506 247,541" fill="#E8B889"/>
      <polygon points="190,505 247,541 247,591 190,556" fill="#CE926D"/>
      <polygon points="247,541 304,506 304,556 247,591" fill="#B7795D"/>
      <polygon points="177,496 247,454 316,494 247,536" fill="#D97869"/>
      <polygon points="177,496 247,536 247,548 177,508" fill="#B85D5A"/>
    </g>

    <!-- trees -->
    <g>
      <g transform="translate(129 469)"><rect x="-6" y="36" width="12" height="42" rx="5" fill="#6E4D36"/><circle cx="0" cy="28" r="31" fill="#2F754A"/><circle cx="-12" cy="18" r="20" fill="#438D59"/><circle cx="15" cy="16" r="20" fill="#56A66A"/></g>
      <g transform="translate(548 447) scale(.8)"><rect x="-6" y="36" width="12" height="42" rx="5" fill="#6E4D36"/><circle cx="0" cy="28" r="31" fill="#2F754A"/><circle cx="-12" cy="18" r="20" fill="#438D59"/><circle cx="15" cy="16" r="20" fill="#56A66A"/></g>
      <g transform="translate(542 637) scale(.72)"><rect x="-6" y="36" width="12" height="42" rx="5" fill="#6E4D36"/><circle cx="0" cy="28" r="31" fill="#2F754A"/><circle cx="-12" cy="18" r="20" fill="#438D59"/><circle cx="15" cy="16" r="20" fill="#56A66A"/></g>
    </g>

    <!-- small abstract citizens -->
    <g>
      <ellipse cx="462" cy="642" rx="13" ry="8" fill="#1B3040" opacity="0.45"/>
      <circle cx="462" cy="609" r="10" fill="#F0BF94"/><path d="M449 620 Q462 612 475 620 L471 650 L453 650 Z" fill="#E3C259"/>
      <ellipse cx="224" cy="646" rx="12" ry="7" fill="#1B3040" opacity="0.45"/>
      <circle cx="224" cy="618" r="9" fill="#EAB68C"/><path d="M212 628 Q224 620 236 628 L233 655 L215 655 Z" fill="#6EA8C8"/>
    </g>

    <!-- legibility vignette -->
    <rect x="64" y="232" width="620" height="540" fill="url(#sceneShade)"/>
  </g>

  <!-- Left card labels -->
  <rect x="96" y="268" width="252" height="36" rx="18" fill="#102432" stroke="#7BBBC8"/>
  <text x="222" y="292" text-anchor="middle" fill="#D6F3F6" font-family="'Segoe UI', 'Noto Sans KR', Arial, sans-serif" font-size="15" font-weight="750" letter-spacing="1.25">Cropout에서 배운 것</text>
  <text x="96" y="360" fill="#FFFFFF" font-family="'Segoe UI', 'Noto Sans KR', Arial, sans-serif" font-size="54" font-weight="850">Cropout</text>
  <text x="96" y="398" fill="#D7E5EA" font-family="'Segoe UI', 'Noto Sans KR', Arial, sans-serif" font-size="20">Blueprint 공식 예제 · 아키텍처 학습 기준</text>
  <g font-family="'Segoe UI', 'Noto Sans KR', Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="96" y="690" width="116" height="40" rx="20" fill="#0C1B25" stroke="#87C9C6"/><text x="154" y="716" text-anchor="middle" fill="#E4F7F3">Common UI</text>
    <rect x="224" y="690" width="145" height="40" rx="20" fill="#0C1B25" stroke="#87C9C6"/><text x="296" y="716" text-anchor="middle" fill="#E4F7F3">Enhanced Input</text>
    <rect x="381" y="690" width="126" height="40" rx="20" fill="#0C1B25" stroke="#87C9C6"/><text x="444" y="716" text-anchor="middle" fill="#E4F7F3">Save / Load</text>
    <rect x="519" y="690" width="125" height="40" rx="20" fill="#0C1B25" stroke="#87C9C6"/><text x="581" y="716" text-anchor="middle" fill="#E4F7F3">모바일 + PC</text>
  </g>

  <!-- Transformation route -->
  <path d="M706 496 C748 496 761 496 801 496" fill="none" stroke="#07111A" stroke-width="16" stroke-linecap="round"/>
  <path d="M706 496 C748 496 761 496 801 496" fill="none" stroke="url(#route)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="713" cy="496" r="12" fill="#75E7C5" stroke="#102433" stroke-width="5"/>
  <path d="M789 482 L810 496 L789 510 Z" fill="#55D7FF"/>
  <text x="758" y="446" text-anchor="middle" fill="#A8EAFA" font-family="'Segoe UI', 'Noto Sans KR', Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.1">학습</text>
  <text x="758" y="466" text-anchor="middle" fill="#A8EAFA" font-family="'Segoe UI', 'Noto Sans KR', Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.1">분해</text>
  <text x="758" y="542" text-anchor="middle" fill="#A8EAFA" font-family="'Segoe UI', 'Noto Sans KR', Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.1">재설계</text>

  <!-- Right architecture card -->
  <rect x="831" y="242" width="705" height="540" rx="30" fill="#02070D" opacity="0.5"/>
  <rect x="823" y="232" width="713" height="540" rx="30" fill="url(#rightCard)" stroke="#2EA9D0" stroke-width="2"/>
  <rect x="855" y="268" width="232" height="36" rx="18" fill="#11445C" stroke="#3CC6EE"/>
  <text x="971" y="292" text-anchor="middle" fill="#CBF4FF" font-family="'Segoe UI', 'Noto Sans KR', Arial, sans-serif" font-size="15" font-weight="750" letter-spacing="1.25">이 프로젝트에서 직접 구축</text>
  <text x="855" y="359" fill="#FFFFFF" font-family="'Segoe UI', 'Noto Sans KR', Arial, sans-serif" font-size="40" font-weight="850">회사키우기<tspan dx="14" font-size="21" font-weight="600" fill="#95DFF3">CompanyGrowthRenewal</tspan></text>
  <text x="855" y="395" fill="#95DFF3" font-family="'Segoe UI', 'Noto Sans KR', Arial, sans-serif" font-size="19">UE5.4 클라이언트 아키텍처 · 프로젝트가 직접 소유한 책임 경계</text>

  <!-- Architecture pillars -->
  <g font-family="'Segoe UI', 'Noto Sans KR', Arial, sans-serif">
    <line x1="890" y1="444" x2="890" y2="707" stroke="#2F6D88" stroke-width="3"/>

    <rect x="855" y="426" width="649" height="69" rx="17" fill="url(#pillar)" stroke="#2E5870"/>
    <circle cx="890" cy="460" r="20" fill="#1A6781"/><text x="890" y="467" text-anchor="middle" fill="#D6F7FF" font-size="16" font-weight="800">01</text>
    <text x="927" y="454" fill="#F1F8FB" font-size="21" font-weight="800">수명주기 서비스 구성</text>
    <text x="927" y="480" fill="#9FC2D1" font-size="17">Subsystem · Manager · ActorComponent</text>

    <rect x="855" y="506" width="649" height="69" rx="17" fill="url(#pillar)" stroke="#2E5870"/>
    <circle cx="890" cy="540" r="20" fill="#276E78"/><text x="890" y="547" text-anchor="middle" fill="#E0FCF7" font-size="16" font-weight="800">02</text>
    <text x="927" y="534" fill="#F1F8FB" font-size="21" font-weight="800">타입 데이터 → 수명주기 안전 UI 라우팅</text>
    <text x="927" y="560" fill="#9FC2D1" font-size="17">DataTable 단일 기준 · 캐시 getter · CommonUI 3스택</text>

    <rect x="855" y="586" width="649" height="69" rx="17" fill="url(#pillar)" stroke="#2E5870"/>
    <circle cx="890" cy="620" r="20" fill="#33706B"/><text x="890" y="627" text-anchor="middle" fill="#E8FFF9" font-size="16" font-weight="800">03</text>
    <text x="927" y="614" fill="#F1F8FB" font-size="21" font-weight="800">크로스플랫폼 카메라 도메인</text>
    <text x="927" y="640" fill="#9FC2D1" font-size="17">공용 API · PC 가속 · 모바일 터치 드래그</text>

    <rect x="855" y="666" width="649" height="69" rx="17" fill="url(#pillar)" stroke="#2E5870"/>
    <circle cx="890" cy="700" r="20" fill="#3A6B8F"/><text x="890" y="707" text-anchor="middle" fill="#E4F2FF" font-size="16" font-weight="800">04</text>
    <text x="927" y="694" fill="#F1F8FB" font-size="21" font-weight="800">결정적 게임플레이 파이프라인</text>
    <text x="927" y="720" fill="#9FC2D1" font-size="17">배치 판정 단일 기준 · 직원 얼굴 사진 촬영 FIFO · 자동화 테스트</text>
  </g>

  <!-- Footer -->
  <circle cx="67" cy="835" r="5" fill="#55D7FF"/>
  <text x="84" y="841" fill="#B8C7D3" font-family="'Segoe UI', 'Noto Sans KR', Arial, sans-serif" font-size="18">패턴만 참고 · 구현은 독립적으로 재작성 · 근거는 소스 링크</text>
  <text x="1536" y="841" text-anchor="end" fill="#718596" font-family="'Segoe UI', 'Noto Sans KR', Arial, sans-serif" font-size="15">Cropout 코드·콘텐츠 복사 없음 · Epic Games와 무관</text>
</svg>

