<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>치트 명령어 치트 시트 — CompanyGrowthRenewal</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #f0f2f5;
    --border: #e2e5ea;
    --border-strong: #d2d6dd;
    --text: #1c2430;
    --muted: #6b7480;
    --accent: #2563eb;
    --accent-soft: #eaf0ff;
    --code-bg: #f3f4f7;
    --code-text: #1746b8;
    --ctx: #b45309;
    --ctx-bg: #fef3e2;
    --shadow: 0 1px 2px rgba(20,30,50,.05), 0 1px 8px rgba(20,30,50,.04);
  }
  html[data-theme="dark"] {
    --bg: #0f1218;
    --panel: #171b22;
    --panel-2: #1e232c;
    --border: #2a303b;
    --border-strong: #3a414e;
    --text: #e8ecf3;
    --muted: #9aa4b2;
    --accent: #6aa6ff;
    --accent-soft: #1b2740;
    --code-bg: #11151c;
    --code-text: #8ec0ff;
    --ctx: #fbbf24;
    --ctx-bg: #2a2415;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 150px; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    font-size: 16px;
  }
  code, .mono { font-family: "Cascadia Code", "Consolas", "D2Coding", monospace; }

  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .head-inner { max-width: 920px; margin: 0 auto; padding: 16px 24px 12px; }
  .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 21px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .theme-btn {
    border: 1px solid var(--border-strong); background: var(--panel-2); color: var(--text);
    border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .theme-btn:hover { border-color: var(--accent); }

  .controls { margin-top: 14px; }
  #search {
    width: 100%;
    background: var(--code-bg); border: 1.5px solid var(--border-strong);
    color: var(--text); border-radius: 10px; padding: 12px 16px; font-size: 16px;
    outline: none; transition: border-color .12s;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: var(--accent); background: var(--panel); }

  .navbar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    border: 1px solid var(--border-strong); background: var(--panel);
    color: var(--muted); border-radius: 999px; padding: 5px 13px;
    font-size: 12.5px; cursor: pointer; user-select: none; transition: .12s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .chip .cdot { width: 8px; height: 8px; border-radius: 50%; }
  .chip.active .cdot { background: #fff !important; }

  main { max-width: 920px; margin: 0 auto; padding: 22px 24px 60px; }
  .hint { color: var(--muted); font-size: 13.5px; margin: 0 0 24px; }
  .hint b { color: var(--text); }

  .cat { margin-bottom: 34px; scroll-margin-top: 150px; }
  .cat-head {
    display: flex; align-items: center; gap: 9px; margin: 0 0 4px;
    padding-bottom: 8px; border-bottom: 2px solid var(--border);
  }
  .cat-head .bar { width: 4px; height: 18px; border-radius: 2px; }
  .cat-head h2 { font-size: 16px; margin: 0; }
  .cat-head .count { color: var(--muted); font-weight: 400; font-size: 13px; }

  .row {
    display: grid; grid-template-columns: 300px 1fr; gap: 18px;
    padding: 16px 4px; border-bottom: 1px solid var(--border); align-items: start;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--panel-2); border-radius: 8px; }

  .cmd-cell { display: flex; flex-direction: column; gap: 7px; }
  .cmd {
    font-family: "Cascadia Code","Consolas","D2Coding",monospace; font-size: 15px; font-weight: 600;
    background: var(--code-bg); border: 1px solid var(--border-strong); border-radius: 7px;
    padding: 8px 11px; cursor: pointer; color: var(--code-text); transition: .12s;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; line-height: 1.35;
  }
  .cmd:hover { border-color: var(--accent); background: var(--accent-soft); }
  .cmd .copyicon { font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .cmd.copied { color: #15803d; border-color: #15803d; background: #e9f9ef; }
  html[data-theme="dark"] .cmd.copied { color: #4ade80; border-color: #4ade80; background: #16271c; }
  .ctx {
    align-self: flex-start;
    font-size: 11.5px; background: var(--ctx-bg); color: var(--ctx);
    border-radius: 5px; padding: 2px 9px; font-weight: 600;
  }

  .info-cell { padding-top: 2px; }
  .desc { font-size: 15px; margin: 0 0 8px; }
  .ex {
    font-family: "Cascadia Code","Consolas",monospace; font-size: 13px; color: var(--muted);
    background: var(--code-bg); border-radius: 5px; padding: 3px 8px; display: inline-block;
  }
  .ex b { color: var(--text); font-weight: 600; }
  .note {
    font-size: 13px; color: var(--muted); margin-top: 8px;
    padding-left: 12px; border-left: 3px solid var(--border-strong);
  }

  .empty { color: var(--muted); text-align: center; padding: 50px; display: none; font-size: 15px; }
  footer { color: var(--muted); font-size: 13px; text-align: center; padding: 28px 24px; border-top: 1px solid var(--border); max-width: 920px; margin: 0 auto; }
  footer code { background: var(--code-bg); padding: 1px 6px; border-radius: 4px; }
  kbd {
    background: var(--panel-2); border: 1px solid var(--border-strong); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 6px; font-family: monospace; font-size: 12px; color: var(--text);
  }
  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #15803d; color: #fff; padding: 11px 22px; border-radius: 9px;
    font-weight: 600; font-size: 14px; opacity: 0; transition: .25s; pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,.2);
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr; gap: 10px; }
    .head-inner, main { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="title-row">
      <div>
        <h1>치트 명령어 치트 시트</h1>
        <div class="sub">CompanyGrowthRenewal · PIE에서 <kbd>~</kbd> 콘솔 열고 입력 · Shipping 빌드 자동 비활성화</div>
      </div>
      <button class="theme-btn" id="themeBtn">🌙 다크 모드</button>
    </div>
    <div class="controls">
      <input id="search" type="text" placeholder="🔍  명령어 검색 (예: mine, 직원, exp, 본사)..." autofocus>
      <div class="navbar" id="navbar"></div>
    </div>
  </div>
</header>

<main>
  <p class="hint">명령어를 <b>클릭하면 복사</b>됩니다. 칩으로 카테고리를 필터링하거나 점프하세요. <span class="ctx">맥락</span> = 동작하는 맵/조건.</p>
  <div id="list"></div>
  <div class="empty" id="empty">검색 결과가 없습니다.</div>
</main>

<footer>
  단일 진실 소스: <code>Public/Player/CGCheatManager.h</code> ·
  결과는 Output Log <code>LogCGCheat</code> / <code>LogTemp</code> 에서 확인 ·
  명령어 추가 시 이 파일과 <code>CHEAT_COMMANDS.md</code> 동기화
</footer>

<div id="toast">복사됨!</div>

<script>
const CATEGORIES = {
  "기본":   "#94a3b8",
  "경험치": "#3b82f6",
  "자원":   "#10b981",
  "직원":   "#a855f7",
  "스테이지":"#ec4899",
  "운영":   "#f97316",
  "아이템": "#eab308",
  "건물":   "#0ea5e9",
  "벽돌공장": "#b45309",
  "본사":   "#84cc16",
  "채광":   "#d97706",
  "생산":   "#059669",
  "판매":   "#14b8a6",
  "특성":   "#d946ef",
  "프리셋": "#6366f1",
  "프로젝트 진척": "#8b5cf6",
  "진행프리셋": "#7c3aed",
  "카메라": "#22d3ee",
  "튜토리얼":"#ef4444",
  "미션판": "#4ade80",
  "시간대": "#06b6d4",
  "도시인수": "#f43f5e",
  "백로그":  "#8b5cf6",
  "UI디버그": "#64748b",
  "이동속도": "#fca5a5",
  "밸런스계측": "#0891b2"
};

const COMMANDS = [
  { cat:"기본", cmd:"CheatPing", desc:"콘솔 디스패치가 작동하는지 확인 (PONG 로그 + 화면 메시지)", ctx:"어디서나", ex:"CheatPing" },

  { cat:"경험치", cmd:"Exp [Amount] [ID]", desc:"직원에게 경험치 추가. ID 생략 시 선택된 직원", ctx:"직원 선택 필요", ex:"Exp 100 / Exp 100 3" },
  { cat:"경험치", cmd:"DistExp [Amount] [Grade]", desc:"현재 관리 중인 빌딩 직원들에게 분배. Grade 0=F ~ 5=S (생략=B 1.0x)", ctx:"관리 중 빌딩 필요", ex:"DistExp 50 / DistExp 100 5" },
  { cat:"경험치", cmd:"ExpStatus", desc:"전체 직원 경험치/레벨/소속 빌딩 상태 표시", ctx:"어디서나", ex:"ExpStatus" },

  { cat:"자원", cmd:"Money [Amount]", desc:"돈 추가 (int64)", ctx:"어디서나", ex:"Money 10000" },
  { cat:"자원", cmd:"ShowResources", desc:"현재 보유 자원 표시", ctx:"어디서나", ex:"ShowResources" },
  { cat:"자원", cmd:"GrantRes [RowName]", desc:"테스트 자원 시나리오 일괄 적용 (DT_TestResourceScenarios). 생략 시 Default", ctx:"어디서나", ex:"GrantRes Rich", note:"RowName: Rich / Default / Poor / Empty. DT에 없으면 FAIL 로그." },

  { cat:"직원", cmd:"ListEmp", desc:"전체 직원 목록 표시 (선택된 직원은 >>> 표시)", ctx:"어디서나", ex:"ListEmp" },
  { cat:"직원", cmd:"SetRank [Level]", desc:"선택 직원의 강화 레벨 설정 (0-12) + 외모 갱신", ctx:"직원 선택 필요", ex:"SetRank 6", note:"0 인턴 · 1 사원 · 2 주임 · 3 대리 · 4 과장 · 5 차장 · 6 부장 · 7 이사 · 8 상무 · 9 전무 · 10 부사장 · 11 사장 · 12 회장" },
  { cat:"직원", cmd:"SetCrit [Percent]", desc:"직원 크리티컬 확률을 강제로 Percent%로 설정(트레일러용, 기본 50). -1이면 해제(정상 크리율 복귀)", ctx:"OfficeMap", ex:"SetCrit / SetCrit 50 / SetCrit -1", note:"UOfficeStageProgressManager::GetCriticalChance() 오버라이드(기본 크리율/Fortune 특성/피버 무시). 스테이지 리셋에 영향 안 받아 프로젝트 바뀌어도 유지 → 트레일러 캡처 내내 크리 자주 터짐. 직원 버프/큐브 크리 보너스는 가산되어 실제론 지정값 이상 가능. 월드 서브시스템이라 OfficeMap 세션 한정." },
  { cat:"직원", cmd:"SetStat [StatIndex] [Value] [ID]", desc:"선택(또는 지정 ID) 직원의 6스탯 중 1개를 Value로 직접 설정. 음수는 0으로 클램프", ctx:"직원 선택 필요", ex:"SetStat 1 35 / SetStat 1 35 3", note:"StatIndex: 0 업무속도(WorkSpeed) · 1 크리티컬 확률(CritChance) · 2 침착성(Composure) · 3 경험치획득(ExpGain) · 4 체력(Stamina) · 5 수익보너스(IncomeBonus). ID 생략 시 선택된 직원(Exp와 동일 규칙). ★ 강화 반복 없이 스탯 1개의 효과만 격리 검증하기 위한 치트(Task 6~10 전제 도구)." },
  { cat:"직원", cmd:"StatStatus [ID]", desc:"선택(또는 지정 ID) 직원의 6스탯 저장값 + 강화보너스 + 유효값 + 종합 점수 출력", ctx:"직원 선택 필요", ex:"StatStatus / StatStatus 3" },
  { cat:"직원", cmd:"EmpName [RarityValue] [Count]", desc:"이름 생성기를 Count번 호출해 로그 출력. 실제 직원 생성/세이브 없음", ctx:"어디서나", ex:"EmpName 5 100", note:"RarityValue: 0 Common · 1 Unusual · 2 Rare · 3 Epic · 4 Legendary · 5 Mythic. Count는 1~500 클램프. ★ Mythic 1%는 실제 뽑기로 검증 불가라 생성기만 격리 호출하는 검증 도구. Legendary/Mythic은 통짜 이름이라 성이 안 붙어야 정상." },

  { cat:"스테이지", cmd:"CompleteStep", desc:"3개 카테고리 모두 MinimumScore 이상 되도록 보너스 점수 부여", ctx:"OfficeMap", ex:"CompleteStep" },
  { cat:"스테이지", cmd:"StageStatus", desc:"현재 스테이지 상태 표시 (프로젝트/Step/점수/시간/품질/타이머)", ctx:"OfficeMap", ex:"StageStatus" },
  { cat:"스테이지", cmd:"Stage_FillScores [Percent]", desc:"활성 직능 스텝 점수를 목표의 Percent%(기본 100, 0~200)로 일괄 세팅 — 30=출시차단(실패 페이지) 재현 / 95=Best 컨텍스트 리뷰 재현", ctx:"OfficeMap, 개발 진행 중", ex:"Stage_FillScores 30" },

  { cat:"운영", cmd:"SetOpTime [Seconds]", desc:"현재 관리 중인 빌딩 운영 남은 시간 설정 (0 = 다음 틱 즉시 완료)", ctx:"관리 중 빌딩 필요", ex:"SetOpTime 0", note:"현재 빌딩에 진행 중인 운영이 있어야 동작. ElapsedTime도 동기화." },
  { cat:"운영", cmd:"OpStatus", desc:"진행 중인 모든 운영 상태 표시 (빌딩/품질/시간/수익)", ctx:"어디서나", ex:"OpStatus" },
  { cat:"운영", cmd:"RevenueMax [Amount]", desc:"모든 건물 금고를 건물당 Amount원(기본 500만) 절대액으로 강제 충전 → 돈 버블 전부 표시. 수거는 안 함", ctx:"어디서나", ex:"RevenueMax / RevenueMax 10000000", note:"금고 용량 무시하고 절대액 세팅 → 전체수거 시 그대로 회수돼 코인 100개 상한까지 우수수. 예전 비율 방식은 용량(수백 원)이 작아 수거액이 작았음(2026-07-13 절대액으로 변경)." },
  { cat:"운영", cmd:"ShowOfflineReport [Hours] [Zero] [FakeRows]", desc:"오프라인 정산 모달 즉시 표시(60초 대기/앱 라이프사이클 없이). 기본=실제 지은 건물만(금고도 채워 [모두 수령] 검증). Hours≥12=12h캡 변주, Zero=1=적립0 변주, FakeRows>0=그 개수까지 가짜 행 패딩(레이아웃/스크롤 테스트, 최대30)", ctx:"MainMap", ex:"ShowOfflineReport / ShowOfflineReport 14 / ShowOfflineReport 3 1 / ShowOfflineReport 3 0 8", note:"실제 표시 경로(DebugSetPendingOfflineReport→TryShowOfflineReport→Consume→모달) 그대로 태워 회귀 테스트 겸용. FakeRows 가짜 행은 존재 안 하는 인덱스라 '건물 N' 폴백. [모두 수령]은 실제 금고 잔액을 수거." },

  { cat:"아이템", cmd:"Ticket [Amount] [Tier]", desc:"채용권 지급 (기본 10장, Normal). Tier 0=Normal · 1=Advanced · 2=Premium", ctx:"어디서나", ex:"Ticket 30 2" },
  { cat:"아이템", cmd:"TraitTicket [Amount] [Tier]", desc:"건물 특성 뽑기권 지급 (가챠 풀 플로우 테스트용). 기본 30장", ctx:"어디서나", ex:"TraitTicket / TraitTicket 50 0", note:"Tier 0=Normal만 · 1=Advanced만 · -1(기본)=둘 다. 가챠 우회 직접 지급은 SeedTraits." },
  { cat:"아이템", cmd:"SkinTicket [Amount] [Tier]", desc:"건물 스킨 뽑기권 지급 (스킨 가챠 풀 플로우 테스트용). 기본 30장", ctx:"어디서나", ex:"SkinTicket / SkinTicket 50 1", note:"Tier 0=Normal만 · 1=Advanced만 · -1(기본)=둘 다." },
  { cat:"아이템", cmd:"Card [Amount] [Tier]", desc:"잠재 명함 지급 — 직원창 잠재 리롤 테스트용. 기본 20장씩 3종 전부", ctx:"어디서나", ex:"Card / Card 5 2", note:"Tier 0=종이(레어까지) · 1=골드(에픽까지) · 2=블랙(레전드리까지) · -1(기본)=전부. 상점 구매를 우회한다. AddItem 이 OnItemChanged 를 쏘므로 직원창이 열려 있어도 슬롯 수량·리롤 버튼 활성이 즉시 갱신됨." },
  { cat:"아이템", cmd:"LootRoll [TableKey] [Tier] [Count]", desc:"출시 전리품 드랍(DT_LaunchLoot) 롤 시뮬레이션. 지급 없이 분포만 로그로 확인 (기본 High · Tier 10 · 10회)", ctx:"어디서나", ex:"LootRoll / LootRoll Mid 5 50", note:"TableKey = Low(평점<24) / Mid(24~31) / High(≥32). 롤 수 = 테이블 기본(Low·Mid 2, High 3) + 티어 보너스(T4~6 +1, T7~10 +2). ScaleBasis는 개발비 100,000 고정 — 비례 엔트리(만분율) 검증용. 결과는 지급되지 않음(bGrant=false)." },

  { cat:"건물", cmd:"UnlockSkins [Count]", desc:"미보유 스킨 중 랜덤 해금 (기본 5개)", ctx:"어디서나", ex:"UnlockSkins 10" },
  { cat:"건물", cmd:"BldLightsOn [bOn]", desc:"모든 건물 창문 조명을 운영 여부와 무관하게 항상 켬(1, 기본) / 원래 정책(운영 중만 점등)으로 복원(0)", ctx:"MainMap", ex:"BldLightsOn / BldLightsOn 0", note:"ABuildingBaseActor 전역 강제 플래그로 SetWindowLightActive(false) 요청을 무시 → 재평가와 무관하게 항상 켬. off 경로가 그 함수 단일 창구뿐이라 견고. 전역 static 이라 PIE 재시작 시에도 유지될 수 있음(끄려면 BldLightsOn 0)." },

  { cat:"벽돌공장", cmd:"UnlockFactoryAuto", desc:"현재 맵의 모든 벽돌공장 자동 수집을 즉시 해금(HQ Lv.10 대기 없이). 자동 수집/최대 용량 강화 슬롯 잠금 해제 + 벽돌 재고 슬롯 활성 + 다음 공장 패널 오픈 시 해금 연출 1회", ctx:"공장 배치된 맵", ex:"UnlockFactoryAuto", note:"정규 해금 축(USaveLoadManager::OnHQLevelUp → DT_FactoryUpgradeDefinition.RequiredHQLevel 충족, 현재 출하값 10)을 우회해 ABrickFactory::UnlockAutoCollection() 직접 호출. 해금 상태는 세이브(bAutoCollectionUnlocked)에 남으므로 되돌리려면 세이브 삭제. 자동 수집 타이머 간격은 하한 0.25초 클램프. 이미 해금된 공장은 무시." },
  { cat:"벽돌공장", cmd:"FactoryMax [AmountLevel] [SpeedSeconds]", desc:"현재 맵의 모든 벽돌공장 개수+속도 만렙. 공장 홀드하면 벽돌 우수수 (트레일러용). AmountLevel로 개수 조절(-1=만렙), SpeedSeconds>0이면 버스트 간격(초)을 곡선 대신 직접 오버라이드 → 재빌드 없이 PIE 라이브 튜닝", ctx:"공장 배치된 맵", ex:"FactoryMax / FactoryMax -1 0.3 / FactoryMax 30 0.07", note:"간격=우수수 밀도 레버: 0.045=스트로브, 0.1=펄스, 0.07=폭포, 0.3=청크드롭. 개수 만렙은 +N/카운터 숫자만 키움(스프라이트는 BrickBurstMaxIcons 캡→프레임 안전). 자동수집은 안 건드림(가득참 알림이 컷 망침). 비용 차감 없음. 홀드할 때만 나옴." },

  { cat:"본사", cmd:"HQLevelUp", desc:"조건 무시하고 본사 레벨 +1 (저장 + 델리게이트 브로드캐스트)", ctx:"어디서나", ex:"HQLevelUp" },
  { cat:"본사", cmd:"SetHQLv [Level]", desc:"본사 레벨 직접 설정 (최소 1, 저장 + 델리게이트)", ctx:"어디서나", ex:"SetHQLv 8" },

  { cat:"채광", cmd:"MineDebug", desc:"모든 채광 활성 국가의 라인 상태/강화 레벨/분당 채취량 출력", ctx:"WorldMap", ex:"MineDebug" },
  { cat:"채광", cmd:"MineFill [Country]", desc:"지정 국가 모든 라인을 한도까지 채움 (수령/saturated UI 테스트)", ctx:"WorldMap", ex:"MineFill Australia", note:"국가: Australia / Canada / Brazil / SouthAfrica / China / Saudi" },
  { cat:"채광", cmd:"MineSetLv [Country] [Rate|Storage] [Level]", desc:"채광 강화 레벨까지 반복 업그레이드. Rate=속도 +15%/lv, Storage=한도 +100/lv", ctx:"WorldMap", ex:"MineSetLv Australia Rate 5", note:"레벨 다운 미지원 (낮추려면 새 세이브). 라인 없으면 EnsureCountryLines 자동 호출." },

  { cat:"생산", cmd:"Prod_Country [Country]", desc:"지정 국가에서 제작 가능한 주문서 전량 + 각 주문의 제작가능수/병목 재료 + 라인 현황 출력", ctx:"WorldMap", ex:"Prod_Country Korea", note:"국가의 SupportedIndustries 로 걸러진 목록 = 제작 시작 팝업이 보여주는 것과 동일(GetMaxProducible 공유). 국가별로 보이는 게 다른 건 정상 — Korea=Semiconductor / Japan=Electronics / Germany=Automobile / China·USA=전 산업." },
  { cat:"생산", cmd:"Prod_Orders", desc:"국가 필터 없이 살아있는 주문서 전량 덤프 (ID/산업/제품/등급/남은수량/제작가능수)", ctx:"WorldMap", ex:"Prod_Orders" },
  { cat:"생산", cmd:"Prod_Seed [Count]", desc:"DT_TestProductionOrders 로 테스트 주문서 생성 (생략/-1 = 전체 행)", ctx:"WorldMap", ex:"Prod_Seed / Prod_Seed 5", note:"팝업 테스트 시퀀스 → ① Prod_Seed ② Prod_MatFill 100000 ③ Prod_Country USA ④ Prod_MatSet Lithium 62 (상한) ⑤ Prod_MatFill 0 (불가) ⑥ Fac_FillLines Korea (라인가득). 숫자를 주면 무작위 표본이라 특정 산업이 0 건이 될 수 있음 — 처음엔 숫자 없이." },
  { cat:"생산", cmd:"Prod_MatFill [Amount]", desc:"원자재 10종을 일괄로 그 수량에 맞춤 (기본 100,000). 낮추기도 가능", ctx:"WorldMap", ex:"Prod_MatFill / Prod_MatFill 500", note:"Set API 가 없어 델타로 Store/Spend. 재료 충분/부족 상태를 통째로 만들 때." },
  { cat:"생산", cmd:"Prod_MatSet [Resource] [Amount]", desc:"특정 원자재를 정확히 그 수량으로 (상한/병목 재료 테스트)", ctx:"WorldMap", ex:"Prod_MatSet Lithium 62", note:"IronOre / Copper / Silicon / Lithium / Oil / RareEarth / Aluminum / Wood / Gold / DiamondOre" },
  { cat:"생산", cmd:"Fac_Lines [Country]", desc:"지정 국가 공장 라인 현황 (Active/Max + 각 라인 제품/진행/목표/속도배율)", ctx:"WorldMap", ex:"Fac_Lines Korea" },
  { cat:"생산", cmd:"Fac_FillLines [Country]", desc:"라인이 꽉 찰 때까지 더미 생산 시작 (\"라인 가득\" UI 상태 테스트)", ctx:"WorldMap", ex:"Fac_FillLines Korea", note:"재료 차감 없는 더미 라인. 완주에 수일 걸리므로 되돌리려면 Fac_ClearLines 를 쓸 것." },
  { cat:"생산", cmd:"Fac_ClearLines [Country]", desc:"활성 라인을 전부 즉시 완료 후 수령해 비운다 (Fac_FillLines 되돌리기)", ctx:"WorldMap", ex:"Fac_ClearLines Korea", note:"InstantFinishLine + ClaimLine. 더미가 아닌 진짜 라인도 함께 비워지니 주의." },

  { cat:"판매", cmd:"SeedProducts [Slots] [Min] [Max]", desc:"판매 모달 테스트용 랜덤 인벤 시드 (기본 24슬롯, 100~8000개)", ctx:"WorldMap", ex:"SeedProducts / SeedProducts 30 500 20000", note:"산업 1~6 x 프로젝트 1~5, 등급 F~S 랜덤." },

  { cat:"특성", cmd:"SeedTraits [Kinds] [Min] [Max]", desc:"건물 특성 인벤 랜덤 시드 (기본 30종, 1~5장)", ctx:"어디서나", ex:"SeedTraits / SeedTraits 105 1 10", note:"DT_BuildingTrait 모든 Row 중 랜덤 N개 셔플 부여." },
  { cat:"특성", cmd:"TraitStatus", desc:"특성 보유 현황 출력 (종류 수 / 총 장수 / 등급별)", ctx:"어디서나", ex:"TraitStatus" },
  { cat:"특성", cmd:"TraitEffects [BuildingIndex]", desc:"특성 효과 집계 덤프 — 대상 20종 중 0 아닌 것 + 전사 무역 판매가. 효과축 v2 배선 검증용", ctx:"어디서나", ex:"TraitEffects" },

  { cat:"프리셋", cmd:"ApplyStarterPreset [RowName]", desc:"사무실 스타터 프리셋 강제 적용 (타일 크기 + 데코 배치). 기존 확장 상태 덮어씀", ctx:"OfficeMap", ex:"ApplyStarterPreset Mythic_0", note:"DT_OfficeStarterPreset RowName. 적용 후 OfficeInterior/OfficeManager 복원기 즉시 재실행." },
  { cat:"프리셋", cmd:"ExportStarterPreset", desc:"현재 사무실 배치 데코를 프리셋 CSV 엔트리 형식(상대 좌표)으로 로그 + 파일 출력", ctx:"OfficeMap", ex:"ExportStarterPreset", note:"Saved/StarterPresetExport.txt 에 저장. 스케일 미반영 상대 좌표." },

  { cat:"카메라", cmd:"CamPreset [Index]", desc:"오피스 카메라 각도 프리셋 즉시 적용 (FOV 40/30 고정, 피치만 변화). 0=코지~3=탑다운", ctx:"OfficeMap", ex:"CamPreset 2", note:"0 코지(~-38) · 1 밸런스(~-45) · 2 탑다운(~-53) · 3 하드탑다운(~-60). 확정값은 AOfficeCameraPawn 생성자에 베이크, PIE 재시작 시 리셋." },
  { cat:"카메라", cmd:"CamBand [InP] [OutP] [InF] [OutF]", desc:"오피스 카메라 밴드 수동 지정 — 줌인/줌아웃 피치 + FOV. InF/OutF 생략 시 40/30", ctx:"OfficeMap", ex:"CamBand -44 -58 40 30" },

  { cat:"이동속도", cmd:"WorkerBolt [Count]", desc:"번아웃 배회(직원이 뛰는 유일한 상황)를 즉시 발동 — 피로 누적을 기다리지 않고 러닝 모션 확인", ctx:"OfficeMap · Stage 모드", ex:"WorkerBolt 3", note:"Count 생략 시 전원, 숫자를 주면 앞 N명만 → 걷는 직원과 나란히 비교 가능. EnterSlackBolt 실경로를 그대로 타므로 자리 이탈 + NavMesh 텔레포트 + 배회까지 재현된다. 슬랙 루프는 Stage 전용이라 다른 모드 직원은 건너뛰고 '발동 0명' 경고를 낸다(강제 진입시켜도 다음 프레임에 페이즈가 지워짐)." },
  { cat:"이동속도", cmd:"WorkerSpeed [Value]", desc:"전 직원 MaxWalkSpeed 직접 지정. -1 이면 원래 값 복귀", ctx:"OfficeMap", ex:"WorkerSpeed 320", note:"BS_StickLocomotion 축(걷기125/느린250/보통400/빠른550)을 훑어 전환 지점을 찾는 용도. 임시값 — 슬랙 페이즈가 바뀌면 되돌아가므로 확정값은 MoveSpeedWalk/MoveSpeedBolt 에 옮겨 적을 것." },
  { cat:"이동속도", cmd:"WorkerSpeedStatus", desc:"직원별 모드 / MaxWalkSpeed / 실측 속도 출력", ctx:"OfficeMap", ex:"WorkerSpeedStatus", note:"Speed = GetVelocity().Size2D() = ABP 블렌드스페이스 축 입력값. MaxWalkSpeed 가 125 면 평상시, MoveSpeedBolt 값(기본 450)이면 번아웃 배회 중." },
  { cat:"직원", cmd:"BoltStatus [판초]", desc:"폭주 확률 진단 — 직원별 실효 초당/판당 확률 + 판당 기대 인원", ctx:"OfficeMap", ex:"BoltStatus / BoltStatus 30", note:"직원별로 유효침착성·초당 확률·판당 확률·모드를 찍고 사무실 합계(판당 기대 폭주 인원)를 낸다. 판초 생략 시 15초(DefaultStepDuration) 기준. 강제 발동(WorkerBolt)으로는 확률 튜닝을 검증할 수 없어(표본 수십 회 필요) 계산값을 직접 보여주는 진단용. 확률은 GetEffectiveBoltChance() 를 그대로 읽어 본체 공식과 어긋나지 않는다. 폭주는 피로 사슬과 독립이며 개발(Stage) 중에만 굴린다." },

  { cat:"프로젝트 진척", cmd:"Proj_Seed [Count] [Review]", desc:"개발 이력 + 출시 기록을 임의로 채운다 — [이전 프로젝트] 패널/도감을 실제 플레이 없이 검증", ctx:"OfficeMap", ex:"Proj_Seed 12", note:"현재 티어까지의 프로젝트를 앞에서부터 Count 개(기본 5) '개발 완료'로 기록. Review 0(기본)이면 12~34 랜덤, 값을 주면 고정. DT 미정의 조합은 패널이 걸러내므로 시드에서도 제외한다(안 보이는 이력이 쌓이지 않게). 지나온 티어를 만들려면 Proj_SetTier 를 먼저." },
  { cat:"프로젝트 진척", cmd:"Proj_SetTier [Tier]", desc:"현재 티어 강제 설정 (1~10)", ctx:"OfficeMap", ex:"Proj_SetTier 3", note:"첫 개발(지나온 티어 미개발)과 재개발(개발함)이 한 리스트에 섞이는 걸 보려면 티어를 올려 둬야 한다. Proj_SetTier 3 → Proj_Seed 12 순서 권장." },
  { cat:"프로젝트 진척", cmd:"Proj_ClearHistory", desc:"개발 이력 + 출시 기록 초기화 (빈 상태 화면 확인용)", ctx:"OfficeMap", ex:"Proj_ClearHistory", note:"도감 마일스톤 지급 기록(MilestoneRewardedTiers)도 함께 비워 재지급을 볼 수 있다." },
  { cat:"프로젝트 진척", cmd:"Proj_State", desc:"현재 티어 / 개발 이력 / 출시 기록 수 + 개발한 인덱스 목록 출력", ctx:"OfficeMap", ex:"Proj_State" },

  { cat:"진행프리셋", cmd:"Preset_Apply [Row]", desc:"중반 진행 상태 프리셋 인세션 재적용 — 부지·빌딩·직원·이력·운영중 프로젝트·월드맵 생산·자원을 순서대로 시드", ctx:"MainMap", ex:"Preset_Apply Late", note:"DT_DevProgressPreset RowName (Early/Mid/Late). 비우면 Project Settings > Game > CG Dev 설정값. 시드 순서가 곧 정합성 — 시총이 마지막이라 등급이 자연 승격된다." },
  { cat:"진행프리셋", cmd:"Preset_Verify [Row]", desc:"현재 상태가 프리셋과 정합한지 단언하고 실패 항목을 나열 (실패 0건 = 시드 성공)", ctx:"어디서나", ex:"Preset_Verify", note:"부지 미스폰·DT 행 누락은 전부 무음 부분 실패라 이걸로만 잡힌다. 등급 항목 FAIL = 프리셋 값이 부정합(빌딩/업종/이력 부족)." },

  { cat:"튜토리얼", cmd:"SkipToMission [RowName]", desc:"임의 미션으로 즉시 점프 (선행 상태 시드 + 자원 듬뿍 + 빌딩 체크 포함)", ctx:"인세션", ex:"SkipToMission M3_EnterOffice", note:"DT_Mission RowName. 드롭다운 지정은 Project Settings > Game > CG Dev > 시작 미션." },
  { cat:"튜토리얼", cmd:"ResetTutorial", desc:"세이브 슬롯 삭제 — Stop 후 다시 Play 하면 깨끗한 M1부터", ctx:"어디서나", ex:"ResetTutorial", note:"SkipToMission 누적/체인 완주로 CurrentMissionID=None 된 세이브 복구용. 자원 시드 없음." },

  { cat:"미션판", cmd:"UnlockGoalBoard", desc:"미션판 즉시 언락 + 전수 재평가 + 저장 (튜토리얼 체인 완주 없이 보드 확인)", ctx:"인세션", ex:"UnlockGoalBoard", note:"정규 언락은 체인 마지막 미션 완료 시점. 언락 직후 전수 재평가라 이미 조건을 넘긴 도달형 미션(본사 레벨·건물 수)은 바로 수령 가능 상태가 된다. 이미 언락이면 변화 없음(로그로 구분)." },
  { cat:"미션판", cmd:"CompleteGoal [GoalRowName]", desc:"지정 미션을 강제 충족 처리. 보상 지급은 안 함 — 수령은 미션판 카드의 [수령]", ctx:"인세션", ex:"CompleteGoal G1_RaiseFloor", note:"RowName = DT_Goal 기준: G1_RaiseFloor / G2_HQLevel3 / G3_SecondBuilding / G4_AcquireCompany / G5_DemolishCompany / G11_AcquirePlot / G6_BuildOnClearedPlot / G7_PlacePainting / G8_EquipSkin / G9_EnhanceStat / G10_EquipTrait. DT에 없으면 유효 목록과 함께 FAIL 로그. 선행 미션(PrereqGoalID)가 미수령이면 카드는 잠금이라 수령 버튼이 안 뜬다." },
  { cat:"미션판", cmd:"ResetGoals", desc:"미션판 상태 초기화 — 언락/충족/수령 전부 리셋 + 저장", ctx:"인세션", ex:"ResetGoals", note:"보드가 잠긴 초기 상태로 돌아간다(다시 보려면 UnlockGoalBoard). 이미 지급된 보상 자원은 회수하지 않는다." },
  { cat:"미션판", cmd:"ResetPanelIntro", desc:"패널 최초 진입 안내(딤+구멍+말풍선)를 전부 안 본 상태로 리셋 + 저장 + 제스처 힌트 졸업 리셋", ctx:"인세션", ex:"ResetPanelIntro", note:"직원창(EmployeeWindow)/미션 목록(MissionTracker) 안내 재확인용. 미션 목록 안내를 다시 보려면 ResetPanelIntro → ResetGoals → UnlockGoalBoard 순." },

  { cat:"도시인수", cmd:"Acq_Buy [Key]", desc:"지정 BuildingKey 회사 인수 시도. 자금 충분하면 차감 + Milking 전환 + 저장. 성공=1 실패=0 로그", ctx:"MainMap", ex:"Acq_Buy 5", note:"Key = 스카이라인 빌딩 BP_MB### 번호 (1~40). 자금 부족 시 Money 또는 GrantRes Rich 선행." },
  { cat:"도시인수", cmd:"Acq_State [Key]", desc:"지정 Key의 인수 상태 출력. 0=NotAcquired 1=Milking 2=Depleted 3=Cleared", ctx:"MainMap", ex:"Acq_State 5" },
  { cat:"도시인수", cmd:"Acq_Demolish [Key]", desc:"지정 Key의 회사 철거 = 캐시아웃. Milking/Depleted 에서 동작 -> 즉시 Cleared", ctx:"MainMap", ex:"Acq_Demolish 5", note:"철거가 금고(판돈)를 Money 로 지급하는 유일한 지점이다. 금고 전액 지급. NotAcquired/Cleared 에서는 조용히 무시." },
  { cat:"도시인수", cmd:"Acq_ClearAll", desc:"모든 도시 회사를 즉시 Cleared 로 (자금/현재 상태 무시). 건물 즉시 숨김(데모 연출 없음) + 옥상 비콘 제거 + 부지 구매 게이트 개방 + 저장", ctx:"MainMap", ex:"Acq_ClearAll", note:"Demolish(층별 붕괴 연출 + 금고 캐시아웃)와 달리 연출도 지급도 없이 상태 무관 전 회사를 한 번에 즉시 숨김. 회사별 OnCompanyCleared 브로드캐스트로 비콘/부지 게이트 갱신. 땅까지 접수하려면 이어서 Plot_OwnAll." },
  { cat:"도시인수", cmd:"Acq_FillPot [Key] [Pct]", desc:"Milking 회사의 회수율을 Pct%(기본 90)까지 즉시 진행. 금고만 차고 지갑은 무변동", ctx:"MainMap", ex:"Acq_FillPot 5 / Acq_FillPot 5 100", note:"드립을 건너뛰고 RRemaining 만 끌어내린다(되돌리기 불가 — 이미 그보다 더 찬 금고는 줄이지 않는다). Pct 100 이상이면 그 자리에서 Depleted 전환. 티어가 높으면 자연 회수가 수 시간~24시간이라 회수 완주 검증에는 사실상 필수." },
  { cat:"도시인수", cmd:"Plot_OwnAll", desc:"스폰된 모든 도시 부지를 즉시 소유 (인접/자금/결제 게이트 우회) + 저장 + 가격 배지 갱신", ctx:"MainMap", ex:"Plot_OwnAll", note:"SpawnManager 가 캐시한 모든 부지를 SetOwnedState(true) 로 전환. 세이브는 GatherOwnedPlotIds(IsOwned() 부지 수집) 단일 소스. 보통 Acq_ClearAll 뒤에 실행해 도시 통째 접수." },

  { cat:"시간대", cmd:"Day", desc:"낮으로 고정 (12:00 세팅 + 사이클 정지 → 창문/차량 라이트 OFF)", ctx:"TimeCycle 액터 필요", ex:"Day" },
  { cat:"시간대", cmd:"Night", desc:"밤으로 고정 (00:00 세팅 + 사이클 정지 → 창문/차량 라이트 ON)", ctx:"TimeCycle 액터 필요", ex:"Night" },
  { cat:"시간대", cmd:"SetTime [Hour] [Minute]", desc:"임의 시각으로 고정 (시 0~23, 분 0~59 + 사이클 정지)", ctx:"TimeCycle 액터 필요", ex:"SetTime 18 / SetTime 6 30", note:"WindowLightManager 자체 기준 일출=6시 / 일몰=21시. 완전 낮=7~18시, 완전 밤=22~5시." },
  { cat:"시간대", cmd:"TimeResume", desc:"시간 사이클 재개 (고정 해제 → 다시 시간이 흐름)", ctx:"TimeCycle 액터 필요", ex:"TimeResume" },

  { cat:"백로그", cmd:"CG_TestBacklogMath", desc:"백로그 순익 지수감쇠 수학 자가검증 — peak100 cost10 반감기600 기준 4샘플(t=0/60/600/3600) 로그 출력. 기댓값: ~90 / ~78.8 / ~40 / 0", ctx:"어디서나", ex:"CG_TestBacklogMath", note:"ComputeProductNetPerSec 단위 검증용. ProjectOperationManager 없으면 경고 로그." },
  { cat:"백로그", cmd:"CG_DumpBacklog", desc:"현재 관리 빌딩의 백로그 제품 전체(PID/경과시간/peak/cost/순익) + 빌딩 합산 순익 출력", ctx:"OfficeMap", ex:"CG_DumpBacklog", note:"GetCurrentManagedBuildingIndex 기준 — 관리 빌딩 없으면 경고 로그. 백로그 자동화 배선 검증용." },

  { cat:"UI디버그", cmd:"CG_DumpUI", desc:"UIBase 3스택(Main/Prompt/Bottom) 내용 + 현재 EInputMode 출력", ctx:"어디서나", ex:"CG_DumpUI", note:"입력잠금/유령위젯 진단용 — 화면에 스택 카운트 요약, 상세는 Output Log." },
  { cat:"UI디버그", cmd:"CG_UnlockInput", desc:"입력모드가 UI로 잠겼을 때 강제 Normal 복원 (위젯은 건드리지 않음)", ctx:"어디서나", ex:"CG_UnlockInput", note:"'안 보이는 위젯이 active로 남아 이동 불가' 탈출용. 원인 파악은 CG_DumpUI 먼저." },

  { cat:"밸런스계측", cmd:"Balance_DumpDevScore", desc:"개발 중 프로젝트의 활성 직능 스텝별 획득/목표 + 가중치 + 직능슬롯 + 품질점수 q + 등급 + 통과여부를 [BALV] 한 줄로 출력", ctx:"OfficeMap", ex:"Balance_DumpDevScore", note:"출력: [BALV] DevScore proj=3 tier=1 steps=3 emp=4 s0=48.21/120.00 w0=5 d0=0 ... q=0.7431 grade=C pass=0 running=1 remain=8.30. s/w/d 인덱스는 출시 스텝을 뺀 활성 직능 기준으로 재부여된다. emp = 스폰된 오피스 직원 수(per-employee 산출 분모)." },
  { cat:"밸런스계측", cmd:"Balance_DumpEconomy", desc:"ResourceBank 전 재화 잔액 + 빌딩별 실수익률/안정율/금고잔량/금고용량/남은운영시간 + 직원·방치 인원을 [BALV] 한 줄로 출력", ctx:"어디서나", ex:"Balance_DumpEconomy", note:"재화 키 순서는 EResourceType enum 순회라 세션 간 고정(TMap 순회 순서는 비보장이라 안 쓴다). b_cap 은 CalculateWarehouseCapacity — 운영 없는 빌딩은 200 하한 폴백이 그대로 보인다. b_earned=운영 누적 매출(직원 드립 포함). 직원 드립은 Money 로 직접 들어가고 금고(b_stored)를 안 거치므로 A3=Money 차분 / A4=b_stored 차분으로 따로 봐야 한다. empUnassigned=미배치 직원, empIdle=오피스에서 Idle 모드로 도는 직원." },
  { cat:"밸런스계측", cmd:"Balance_SimOffline [Sec]", desc:"오프라인 정산을 모의 경과초로 dry-run — 세이브/금고/운영 경과를 전혀 바꾸지 않고 적립합·금고초과 손실·운영 경과 진행분만 [BALV]로 출력", ctx:"어디서나", ex:"Balance_SimOffline 3600 / Balance_SimOffline 21600", note:"USaveLoadManager::ComputeOfflineGains(Sec, bApplyToSave=false) 호출. 실지급 경로(CalculateOfflineGains)가 같은 함수를 true 로 부르므로 계산식이 갈릴 수 없다. clipped=금고 초과로 잘린 합, elapsedAdvance=OfflineSeconds x 0.2, skipped=1 이면 실경로였다면 60초 미만이라 통째 스킵됐을 구간. liveOps>0 인데 blds=0 이면 세이브 스테일(정산은 세이브의 CurrentOperation 스냅샷을 읽고 그건 SaveGameData 때만 갱신) — 저장 한 번 태우고 재호출할 것." },
  { cat:"밸런스계측", cmd:"Balance_GateRun [N] [Proj] [Dir]", desc:"게이트 통과율(A2) N판 자동 반복 — 미착석 직원 자동 착석 후 착수/무탭 진행/판정/종료를 이어 돌린다. 판마다 [BALV] GateRun idx/pass/q/grade/emp/typing/desk, 끝나면 [BALV] GateRunDone n/req", ctx:"OfficeMap (Game 산업 빌딩)", ex:"Balance_GateRun 30 / Balance_GateRun 30 1 0", note:"Dir = EProjectDirection (0=표준 1=속도 2=품질 3=연구). Game 산업 전용 — 다른 산업 DT_Project_* 는 Weight_* 가 전부 0이라 steps=0 이 되어 점수축이 없다. 책상 미배정 직원은 Stage 전환 텔레포트에 실패해 Idle 로 되돌아가 기여가 0 이 되므로 AutoSeatEmployee 로 먼저 앉힌다. 착석 판정은 반드시 FindWorkstationByEmployeeID 로 — bIsAssigned 는 '빌딩 배치' 플래그라 그걸로 판정하면 AutoSeat 가 한 번도 안 돌고 좌석 없이 0점 30판이 나온다(2026-08-02 사고). 책상이 아예 없으면 [BALV] 없이 경고만 남기고 중단, 부족하면 좌석 부족 경고. typing=/desk= 는 표본 유효성 지표(그 판에서 책상+Stage+Typing 인원 최대치) — typing=0 인 판은 셋업 실패라 통과율 분모에서 빼야 한다. 개발 40% 부스트 도박은 ResolveBoostGamble(false), 트레이트 이벤트는 HandleEventChoice(0) 으로 고정 자동 해소 — 안 하면 타이머가 영구 정지한다. 실행 중 화면을 건드리면 무탭 측정이 깨진다. slomo 10 가속 가능. 개발비가 판마다 나가니 Money 로 미리 채울 것. timeout=1 인 판은 예산 초과 강제종료라 신뢰 불가." },
  { cat:"밸런스계측", cmd:"Balance_GateRunStop", desc:"진행 중인 Balance_GateRun 즉시 중단", ctx:"OfficeMap", ex:"Balance_GateRunStop", note:"그때까지 나간 GateRun 라인과 GateRunDone n=실제완주수 는 유효하다. n 과 req 가 다르면 부분 실행이라는 뜻." },
];

let activeFilter = "전체";

// ---- 테마 토글 ----
const themeBtn = document.getElementById("themeBtn");
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "dark" ? "☀️ 라이트 모드" : "🌙 다크 모드";
  try { localStorage.setItem("cheat-theme", t); } catch(e) {}
}
themeBtn.onclick = () => applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
let savedTheme = "light";
try { savedTheme = localStorage.getItem("cheat-theme") || "light"; } catch(e) {}
applyTheme(savedTheme);

// ---- 필터/점프 칩 ----
const navbar = document.getElementById("navbar");
const allCats = ["전체", ...Object.keys(CATEGORIES)];
allCats.forEach(c => {
  const chip = document.createElement("span");
  chip.className = "chip" + (c === "전체" ? " active" : "");
  if (c !== "전체") {
    const dot = document.createElement("span");
    dot.className = "cdot";
    dot.style.background = CATEGORIES[c];
    chip.appendChild(dot);
  }
  chip.appendChild(document.createTextNode(c));
  chip.onclick = () => {
    activeFilter = c;
    document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
    chip.classList.add("active");
    render();
  };
  navbar.appendChild(chip);
});

// ---- 렌더 ----
const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");
const searchEl = document.getElementById("search");

function render() {
  const q = searchEl.value.trim().toLowerCase();
  listEl.innerHTML = "";
  let shown = 0;

  for (const cat of Object.keys(CATEGORIES)) {
    if (activeFilter !== "전체" && activeFilter !== cat) continue;
    const items = COMMANDS.filter(c => c.cat === cat).filter(c => {
      if (!q) return true;
      return (c.cmd + " " + c.desc + " " + (c.note||"") + " " + c.cat).toLowerCase().includes(q);
    });
    if (items.length === 0) continue;

    const color = CATEGORIES[cat];
    const section = document.createElement("section");
    section.className = "cat";
    section.innerHTML = `
      <div class="cat-head">
        <span class="bar" style="background:${color}"></span>
        <h2>${cat}</h2><span class="count">${items.length}개</span>
      </div>`;

    for (const c of items) {
      shown++;
      const baseCmd = c.cmd.split(" [")[0];
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <div class="cmd-cell">
          <div class="cmd" data-copy="${baseCmd}" title="클릭하면 '${baseCmd}' 복사">
            <span>${c.cmd}</span><span class="copyicon">⧉</span>
          </div>
          <span class="ctx">${c.ctx}</span>
        </div>
        <div class="info-cell">
          <p class="desc">${c.desc}</p>
          <span class="ex">예) <b>${c.ex}</b></span>
          ${c.note ? `<div class="note">${c.note}</div>` : ""}
        </div>
      `;
      section.appendChild(row);
    }
    listEl.appendChild(section);
  }
  emptyEl.style.display = shown === 0 ? "block" : "none";
}

// ---- 복사 ----
const toast = document.getElementById("toast");
let toastTimer = null;
listEl.addEventListener("click", e => {
  const el = e.target.closest(".cmd");
  if (!el) return;
  const text = el.dataset.copy;
  navigator.clipboard.writeText(text).then(() => {
    el.classList.add("copied");
    setTimeout(() => el.classList.remove("copied"), 700);
    toast.textContent = `복사됨: ${text}`;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1400);
  });
});

searchEl.addEventListener("input", render);
render();
</script>
</body>
</html>
